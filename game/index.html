<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Zoo Esponji</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #58b0f0;
        touch-action: none;
        /* Sin selección ni arrastre del navegador: al pulsar una medicina tras dar otra, Chrome cancelaba el
           puntero (pointercancel) y la medicina se quedaba sin soltar (2026-11-10). */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      canvas {
        -webkit-user-drag: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
